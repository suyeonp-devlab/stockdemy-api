services:
  postgres:
    image: postgres:16
    container_name: stockdemy-postgres
    environment:
      POSTGRES_DB: stockdemy
      POSTGRES_USER: stockdemy
      POSTGRES_PASSWORD: stockdemy
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: stockdemy-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
