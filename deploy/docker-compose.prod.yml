# 운영 배포 (EC2 1대: nginx + app + api + postgres + redis)
# EC2에서 소스를 받아 직접 빌드한다. 레포 배치: ~/stockdemy/stockdemy-api, ~/stockdemy/stockdemy-app
# t3.micro(1GB) 기준으로 컨테이너별 메모리를 제한한다. 합계가 물리 메모리를 넘으므로 스왑(2GB)이 필요하다.
name: stockdemy

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: stockdemy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - api
    mem_limit: 32m

  app:
    build:
      context: ../../stockdemy-app
      # NEXT_PUBLIC_API_URL은 넘기지 않는다 (비어 있으면 접속 주소 기준 /api로 호출)
      args:
        SITE_URL: ${SITE_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    image: stockdemy-app:latest
    container_name: stockdemy-app
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:8080
      SITE_URL: ${SITE_URL}
    expose:
      - "3000"
    depends_on:
      - api
    mem_limit: 256m

  api:
    build:
      context: ..
    image: stockdemy-api:latest
    container_name: stockdemy-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      JAVA_OPTS: "-Xms256m -Xmx384m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      # 브라우저는 nginx 한 주소로 app과 api를 함께 호출한다 (같은 출처)
      CORS_ALLOWED_ORIGINS: ${SITE_URL}
      # HTTP 운영이라 Secure 쿠키를 쓰면 브라우저가 저장하지 않는다
      REFRESH_COOKIE_SECURE: "false"
      DART_API_KEY: ${DART_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS}
    expose:
      - "8080"
    volumes:
      - api-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 700m

  postgres:
    image: postgres:16
    container_name: stockdemy-postgres
    restart: unless-stopped
    command: postgres -c shared_buffers=64MB -c max_connections=20 -c work_mem=4MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m

  redis:
    image: redis:7
    container_name: stockdemy-redis
    restart: unless-stopped
    # 기본 RDB 스냅샷은 유지 (재기동 시 로그인 세션 보존), 만료 시각이 있는 키부터 정리
    command: redis-server --maxmemory 64mb --maxmemory-policy volatile-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 96m

volumes:
  postgres-data:
  redis-data:
  api-logs:
