spring:
  application:
    name: stockdemy-api
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
  task:
    scheduling:
      pool:
        size: 4                     # 장중 시세, 장마감 배치, 지수 갱신, 뉴스 수집이 서로 기다리지 않도록

server:
  port: 8080

jwt:
  access-token-validity-seconds: 1800       # 30분
  refresh-token-validity-seconds: 1209600   # 14일

# 주식 데이터
market-data:
  provider: dummy
  sync-interval-ms: 30000           # 장중 시세 갱신 사이클 종료 후 대기
  sync-initial-delay-ms: 60000      # 기동 직후 초기 적재와 겹치지 않도록 지연
  call-interval-ms: 250             # Yahoo 연속 호출 간격
  index-sync-interval-ms: 30000     # 지수·환율 갱신 종료 후 대기
  index-sync-initial-delay-ms: 5000 # 기동 직후 첫 지수 갱신
  close:                            # MarketSession.settleTime(종가 확정 시각)과 맞출 것
    krx-cron: "0 10 18 * * MON-FRI"     # KRX 장마감 처리 (Asia/Seoul, 지연 시세 확정 이후)
    nasdaq-cron: "0 30 16 * * MON-FRI"  # NASDAQ 장마감 처리 (America/New_York)
  fund-sync-interval-ms: 86400000   # 1일
  fund-refresh-hours: 24

# 뉴스 수집 (언론사 RSS → AI 분석)
news:
  per-stock-limit: 1          # 종목당 AI 분석·저장 건수 (Gemini 무료 한도 고려)
  recent-hours: 48            # 수집 대상 발행 시간 범위, 초기 수집 생략 판단 기준
  max-related-stocks: 4       # 뉴스당 관련 종목 최대 건수
  ai-interval-ms: 6000        # Gemini 연속 호출 간격 (분당 호출 한도 회피)

# DART API (공시)
dart:
  api-key: ${DART_API_KEY:}

# Gemini API
ai:
  daily-limit: 20                 # 무료 티어 모델당 하루 호출 한도 (뉴스 분석·종목 분석·일지 복기 공용)
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.6-flash

# Resend
resend:
  api-key: ${RESEND_API_KEY:}
  from-address: ${RESEND_FROM_ADDRESS:}

# 배치
schedule:
  news: # 매일 07시 뉴스 수집
    cron: "0 0 7 * * *"
